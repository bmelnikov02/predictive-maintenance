services:
  broker:
    image: eclipse-mosquitto:2
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf
    networks:
      - backend
    deploy:
      restart_policy:
        condition: any

  simulator:
    image: ${DOCKERHUB_USER}/pm-simulator:${TAG}
    environment:
      BROKER_HOST: broker
    networks:
      - backend
    deploy:
      restart_policy:
        condition: any

  influxdb:
    image: influxdb:2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  collector:
    image: ${DOCKERHUB_USER}/pm-collector:${TAG}
    environment:
      BROKER_HOST: broker
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    networks:
      - backend
    deploy:
      restart_policy:
        condition: any

  grafana:
    image: grafana/grafana:12.4.15
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:8081/
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/influxdb.yaml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yaml
      - source: grafana_alert_rules
        target: /etc/grafana/provisioning/alerting/rules.yaml
      - source: grafana_dashboard_factory
        target: /etc/grafana/dashboards/factory.json
    networks:
      - frontend
      - backend
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  predictor:
    image: ${DOCKERHUB_USER}/pm-predictor:${TAG}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/ml"]
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - frontend
      - backend
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

  proxy:
    image: nginx:1.30-alpine
    ports:
      - "80:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - frontend
    deploy:
      restart_policy:
        condition: any

configs:
  mosquitto_conf:
    name: pm_mosquitto_conf_${TAG}
    file: ./broker/mosquitto.conf
  nginx_conf:
    name: pm_nginx_conf_${TAG}
    file: ./proxy/nginx.conf
  grafana_datasource:
    name: pm_grafana_datasource_${TAG}
    file: ./grafana/provisioning/datasources/influxdb.yaml
  grafana_dashboards_provider:
    name: pm_grafana_dashboards_provider_${TAG}
    file: ./grafana/provisioning/dashboards/dashboards.yaml
  grafana_alert_rules:
    name: pm_grafana_alert_rules_${TAG}
    file: ./grafana/provisioning/alerting/rules.yaml
  grafana_dashboard_factory:
    name: pm_grafana_dashboard_factory_${TAG}
    file: ./grafana/dashboards/factory.json

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
    internal: true

volumes:
  influxdb-data:
  grafana-data: